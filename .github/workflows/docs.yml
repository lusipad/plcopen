name: Documentation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/docs.yml'
      - 'ci/verify_docs_i18n.py'
      - 'docs/**'
      - 'docs.zh/**'
      - 'overrides/**'
      - 'mkdocs*.yml'
      - 'README.md'
      - 'core/**/*.h'
      - 'cmake/Doxyfile.in'
      - 'CMakeLists.txt'
  pull_request:
    paths:
      - '.github/workflows/docs.yml'
      - 'ci/verify_docs_i18n.py'
      - 'docs/**'
      - 'docs.zh/**'
      - 'overrides/**'
      - 'mkdocs*.yml'
      - 'README.md'
      - 'core/**/*.h'
      - 'cmake/Doxyfile.in'
      - 'CMakeLists.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install mkdocs
        run: pip install mkdocs mkdocs-material

      - name: Install Doxygen
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz

      - name: Build documentation strictly
        run: |
          cmake -S . -B build-docs \
            -DBUILD_TESTING=OFF \
            -DPLCOPEN_BUILD_DEMOS=OFF \
            -DPLCOPEN_BUILD_TESTS=OFF \
            -DPLCOPEN_BUILD_DOCS=ON
          cmake --build build-docs --target docs
          mkdocs build --strict -f mkdocs.yml
          mkdocs build --strict -f mkdocs.en.yml
          mkdir -p site/api
          cp -R build-docs/docs/api/html/. site/api/
          python ci/verify_docs_i18n.py --site-dir site
          test -s site/api/index.html

  deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install mkdocs
        run: pip install mkdocs mkdocs-material

      - name: Install Doxygen
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz

      - name: Deploy to GitHub Pages
        run: |
          cmake -S . -B build-docs \
            -DBUILD_TESTING=OFF \
            -DPLCOPEN_BUILD_DEMOS=OFF \
            -DPLCOPEN_BUILD_TESTS=OFF \
            -DPLCOPEN_BUILD_DOCS=ON
          cmake --build build-docs --target docs
          mkdocs build --strict -f mkdocs.yml
          mkdocs build --strict -f mkdocs.en.yml
          mkdir -p site/api
          cp -R build-docs/docs/api/html/. site/api/
          python ci/verify_docs_i18n.py --site-dir site
          test -s site/api/index.html
          python -m ghp_import -n -p -f \
            -m "Deploy documentation for ${GITHUB_SHA}" site
