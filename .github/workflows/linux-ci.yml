name: Linux CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        include:
          - compiler: gcc
            cc: gcc
            cxx: g++
          - compiler: clang
            cc: clang
            cxx: clang++

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run RT-safety static scan
        run: cmake -P cmake/rt_safety_scan.cmake

      - name: Verify generated compliance matrix
        run: |
          cmake -P cmake/generate_part1_part2_matrix.cmake
          cmake -P cmake/generate_part1_io_matrix.cmake
          cmake -P cmake/generate_part5_io_matrix.cmake

      - name: Verify replay fixtures
        run: cmake -P cmake/verify_replay_fixtures.cmake

      - name: Set up Python
        if: matrix.compiler == 'gcc'
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Configure CMake
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=${{ matrix.cc }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure -LE fuzz

      - name: Print core benchmark baseline
        run: ctest --test-dir build --output-on-failure -R plcopen_core_benchmark -V

      - name: clang-tidy gate (E2)
        if: matrix.compiler == 'clang'
        run: cmake -P cmake/clang_tidy_gate.cmake

      - name: Core cross-compile smoke (legacy)
        if: matrix.compiler == 'gcc'
        run: cmake -P cmake/core_cross_compile_smoke.cmake

      - name: Verify installed find_package consumer
        if: matrix.compiler == 'gcc'
        run: |
          install_prefix="$PWD/build/ci-install"
          cmake --install build --prefix "$install_prefix"
          cmake -S test_package/find_package -B build/ci-find -DCMAKE_PREFIX_PATH="$install_prefix"
          cmake --build build/ci-find --parallel
          ./build/ci-find/plcopen_find_package_smoke

      - name: Verify FetchContent consumer
        if: matrix.compiler == 'gcc'
        run: |
          cmake -S test_package/fetchcontent -B build/ci-fetch -DPLCOPEN_SOURCE_DIR="$PWD"
          cmake --build build/ci-fetch --parallel
          consumer="$(find build/ci-fetch -name 'plcopen_fetchcontent_smoke' -type f -print -quit)"
          test -n "$consumer"
          "$consumer"

      - name: Build and test Python bindings
        if: matrix.compiler == 'gcc'
        run: |
          cmake -S . -B build-python \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
            -DPLCOPEN_BUILD_DEMOS=OFF \
            -DPLCOPEN_BUILD_TESTS=OFF \
            -DPLCOPEN_BUILD_PYTHON_BINDINGS=ON
          cmake --build build-python --parallel
          ctest --test-dir build-python -R pyplcopen_smoke --output-on-failure

      - name: Install Doxygen
        if: matrix.compiler == 'gcc'
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz
          dot -V

      - name: Generate API documentation
        if: matrix.compiler == 'gcc'
        run: |
          cmake -S . -B build-docs \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
            -DBUILD_TESTING=OFF \
            -DPLCOPEN_BUILD_DEMOS=OFF \
            -DPLCOPEN_BUILD_TESTS=OFF \
            -DPLCOPEN_BUILD_DOCS=ON
          cmake --build build-docs --target docs
          test -s build-docs/docs/api/html/index.html
          find build-docs/docs/api/html -name '*.png' -type f -print -quit | grep -q .
          find build-docs/docs/api/html -name '*.map' -type f -print -quit | grep -q .

  benchmark-trend:
    name: E5 benchmark trend (GCC Release)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Verify benchmark trend tool
        run: python -m unittest tools.test_benchmark_trend -v

      - name: Build head benchmark probes
        run: |
          cmake -S . -B build-e5-head \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc \
            -DCMAKE_CXX_COMPILER=g++ \
            -DPLCOPEN_BUILD_DEMOS=OFF
          cmake --build build-e5-head --parallel --target \
            plcopen_core_benchmark plcopen_core_otg_optimality_oracle

      - name: Resolve comparison base
        id: benchmark-base
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
        run: |
          base_sha=""
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            base_sha="$PR_BASE_SHA"
          elif [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            base_sha="$PUSH_BASE_SHA"
          fi

          if [[ "$base_sha" =~ ^0+$ ]]; then
            base_sha=""
          fi

          mode="record"
          if [[ -n "$base_sha" ]] &&
             git cat-file -e "${base_sha}^{commit}" 2>/dev/null &&
             git cat-file -e "${base_sha}:tools/benchmark_trend.py" 2>/dev/null &&
             git cat-file -e "${base_sha}:ci/benchmark-trend-policy.json" 2>/dev/null; then
            mode="compare"
          fi
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      - name: Build base benchmark probes
        if: steps.benchmark-base.outputs.mode == 'compare'
        env:
          BASE_SHA: ${{ steps.benchmark-base.outputs.base_sha }}
        run: |
          base_root="$RUNNER_TEMP/plcopen-e5-base"
          base_build="$RUNNER_TEMP/plcopen-e5-base-build"
          git worktree add --detach "$base_root" "$BASE_SHA"
          cmake -S "$base_root" -B "$base_build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc \
            -DCMAKE_CXX_COMPILER=g++ \
            -DPLCOPEN_BUILD_DEMOS=OFF
          cmake --build "$base_build" --parallel --target \
            plcopen_core_benchmark plcopen_core_otg_optimality_oracle

      - name: Compare benchmark trend (report only)
        id: benchmark-compare
        if: steps.benchmark-base.outputs.mode == 'compare'
        continue-on-error: true
        env:
          BASE_SHA: ${{ steps.benchmark-base.outputs.base_sha }}
        run: |
          base_root="$RUNNER_TEMP/plcopen-e5-base"
          base_build="$RUNNER_TEMP/plcopen-e5-base-build"
          python "$base_root/tools/benchmark_trend.py" compare \
            --policy "$base_root/ci/benchmark-trend-policy.json" \
            --base-benchmark "$base_build/core/plcopen_core_benchmark" \
            --head-benchmark "$GITHUB_WORKSPACE/build-e5-head/core/plcopen_core_benchmark" \
            --base-oracle "$base_build/core/plcopen_core_otg_optimality_oracle" \
            --head-oracle "$GITHUB_WORKSPACE/build-e5-head/core/plcopen_core_otg_optimality_oracle" \
            --output "$GITHUB_WORKSPACE/build-e5/benchmark-trend.json" \
            --base-sha "$BASE_SHA" \
            --head-sha "$GITHUB_SHA"

      - name: Summarize benchmark trend signal
        if: always() && steps.benchmark-base.outputs.mode == 'compare'
        env:
          COMPARE_OUTCOME: ${{ steps.benchmark-compare.outcome }}
        run: |
          if [[ "$COMPARE_OUTCOME" == "success" ]]; then
            echo "### E5 benchmark trend: PASS" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### E5 benchmark trend: report-only regression signal" >> "$GITHUB_STEP_SUMMARY"
            echo "The comparison returned non-zero, but E5 does not gate pull requests or main." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Record benchmark trend bootstrap
        if: steps.benchmark-base.outputs.mode == 'record'
        run: |
          python tools/benchmark_trend.py record \
            --policy ci/benchmark-trend-policy.json \
            --benchmark build-e5-head/core/plcopen_core_benchmark \
            --oracle build-e5-head/core/plcopen_core_otg_optimality_oracle \
            --output build-e5/benchmark-trend.json \
            --sha "$GITHUB_SHA"

      - name: Upload benchmark trend history
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e5-benchmark-trend-${{ github.run_id }}-${{ github.run_attempt }}
          path: build-e5/benchmark-trend.json
          if-no-files-found: warn
          retention-days: 90

  arm64-cross:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install ARM64 toolchain and QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-aarch64-linux-gnu qemu-user-static

      - name: Configure (ARM64 cross-compile)
        run: >
          cmake -S . -B build-arm64
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE=cmake/toolchain-aarch64-linux-gnu.cmake
          -DPLCOPEN_BUILD_DEMOS=OFF

      - name: Build
        run: cmake --build build-arm64 --parallel

      - name: Test (via QEMU user-mode)
        run: >
          ctest --test-dir build-arm64 --output-on-failure
          -E "(benchmark|jitter_harness)" -LE fuzz
