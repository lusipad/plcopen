name: Windows CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    runs-on: windows-latest

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and run test_basic
        run: .\build.ps1 -Clean -Test

      - name: Verify CTest suite
        run: ctest --test-dir build --build-config Release --output-on-failure
