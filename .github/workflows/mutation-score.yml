name: Mutation Score Gate

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

jobs:
  mutation-score:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run mutation score gate (E3)
        run: cmake -P cmake/mutation_score_gate.cmake
