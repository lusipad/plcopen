name: Core Nightly

on:
  workflow_dispatch:
  schedule:
    - cron: '23 2 * * *'

jobs:
  otg-fuzz:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build core fuzz
        run: cmake --build build --target plcopen_core_otg_fuzz plcopen_core_otg_time_optimal_tests --parallel

      - name: Run deterministic OTG fuzz
        run: ./build/core/plcopen_core_otg_fuzz --iterations 1000000

      - name: Run allocation-guard soak (A2)
        run: |
          cmake --build build --target plcopen_core_a2_alloc_guard --parallel
          ./build/core/plcopen_core_a2_alloc_guard --cycles 50000000

      - name: Run time-optimal OTG fuzz
        run: ./build/core/plcopen_core_otg_time_optimal_tests --iterations 1000000
