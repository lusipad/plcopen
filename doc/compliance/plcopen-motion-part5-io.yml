      - {direction: output, class: E, name: CommandAborted, support: Yes, evidence: 'outputs.command_aborted on takeover'}
      - {direction: output, class: B, name: Error, support: Yes, evidence: 'outputs.error for atomic preflight and runtime failure'}
      - {direction: output, class: E, name: ErrorID, support: Yes, evidence: 'outputs.error_id uses rt::ErrorCode'}
