      - {direction: input, class: E, name: Deceleration, support: Yes, evidence: 'deceleration configures relative move'}
      - {direction: input, class: E, name: Jerk, support: Yes, evidence: 'jerk configures relative move'}
      - {direction: input, class: E, name: BufferMode, support: Yes, evidence: 'Aborting and Buffered with blending rejected'}
      - {direction: output, class: B, name: Done, support: Yes, evidence: 'outputs.done after Standstill finalization'}
