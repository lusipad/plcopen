      - {direction: input, class: B, name: Execute, support: Yes, evidence: 'execute rising-edge lifecycle'}
      - {direction: input, class: B, name: Distance, support: Yes, evidence: 'distance submits move_relative or zero finalization'}
      - {direction: input, class: E, name: Velocity, support: Yes, evidence: 'velocity configures relative move'}
