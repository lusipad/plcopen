# ST-L2c FB-level binding authority. Pin schemas are supplied by the set
# sources named below and are validated separately; an FB row alone never
# counts as a registered pin dispatcher.
schema: plcopen-st-binding-fb-catalog-v1
sets:
  iec_basic:
    source: core/fb/basic.h
    pin_source: doc/compliance/iec-basic-fb-io.yml
    expected: 10
  plcopen_part1_part2:
    source: doc/compliance/plcopen-motion-part1-io.yml
    pin_source: doc/compliance/plcopen-motion-part1-io.yml
    expected: 45
  plcopen_part4:
    source: doc/compliance/plcopen-part4-clause-audit.md
    pin_source: doc/compliance/plcopen-motion-part4-io.yml
    expected: 68
  plcopen_part5:
    source: doc/compliance/plcopen-motion-part5-io.yml
    pin_source: doc/compliance/plcopen-motion-part5-io.yml
    expected: 11
fbs:
  # IEC basic 10 (RTC is outside the deterministic ST scope).
  - {set: iec_basic, name: R_TRIG, native: fb::RTrig}
  - {set: iec_basic, name: F_TRIG, native: fb::FTrig}
  - {set: iec_basic, name: SR, native: fb::SR}
  - {set: iec_basic, name: RS, native: fb::RS}
  - {set: iec_basic, name: TON, native: fb::TON}
  - {set: iec_basic, name: TOF, native: fb::TOF}
  - {set: iec_basic, name: TP, native: fb::TP}
  - {set: iec_basic, name: CTU, native: fb::CTU}
  - {set: iec_basic, name: CTD, native: fb::CTD}
  - {set: iec_basic, name: CTUD, native: fb::CTUD}

  # PLCopen Motion Part 1/2, 45 independent FBs.
