INHERIT: mkdocs.base.yml

site_url: https://lusipad.com/plcopen/en/
site_description: >-
  Modern C++ PLCopen motion-control kernel + IEC 61131-3 ST runtime —
  embed it in your controller, or put it under your learning stack
docs_dir: docs
site_dir: site/en

theme:
  language: en

plugins:
  search:
    lang: en

extra:
  alternate:
    - name: 简体中文
      link: /plcopen/
      lang: zh
    - name: English
      link: /plcopen/en/
      lang: en

nav:
  - Home: index.md
  - Getting Started:
    - Python Digital Twin: getting-started/python.md
    - C++ Embedded: getting-started/cpp.md
    - IEC 61131-3 ST: getting-started/st.md
  - Guides:
    - Real-time integration: guides/realtime-integration.md
    - Motion tuning: guides/tuning.md
    - TwinCAT / CODESYS migration: guides/twinCAT-codesys-migration.md
    - Diagnostics and trace: guides/diagnostics.md
    - Online commissioning scope: guides/online-scope.md
    - Operations: operations.md
  - References:
    - Algorithm White-Box: getting-started/algorithms.md
    - Function-block reference: references/fb-reference.md
    - ST runtime: references/st-runtime.md
    - Standards and evidence: references/standards-evidence.md
    - Architecture decisions: references/architecture-decisions.md
    - C++ API (generated): https://lusipad.com/plcopen/api/
  - Project:
    - Overview: project/index.md
    - Status and direction: project/status.md
    - Architecture: project/architecture.md
    - Compliance: project/compliance.md
    - Known boundaries: project/known-boundaries.md
    - Contributing: project/contributing.md
    - Governance: project/governance.md
    - Security: project/security.md
    - Changelog: project/changelog.md
  - Releases:
    - v0.20.0: releases/v0.20.0.md
